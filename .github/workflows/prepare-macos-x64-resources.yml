name: Prepare macOS x64 resources

on:
  workflow_dispatch:

jobs:
  resources:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/fetch-binaries.mjs --platform=darwin --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-darwin-x64-resources
          path: resources/bin/darwin-x64
          if-no-files-found: error
