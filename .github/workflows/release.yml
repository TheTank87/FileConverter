name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Import Developer ID certificate
        env:
          SIGNING_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/diat-developer-id.p12"
          keychain="$RUNNER_TEMP/diat-signing.keychain-db"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 -D -o "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Write App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY" | base64 -D -o "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build signed and notarized macOS installer
        env:
          CSC_NAME: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac
      - name: Verify macOS signature and notarization
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run verify:signing:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-installers
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build signed Windows installers
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:win
      - name: Verify Windows signatures
        run: npm run verify:signing:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - mac
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installers'
          merge-multiple: true
          path: release-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/generate-checksums.mjs release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
