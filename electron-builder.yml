appId: com.diat.converter
productName: The Diat Converter

directories:
  buildResources: resources

mac:
  icon: icon.icns
  category: public.app-category.utilities
  target:
    - dmg
  x64ArchFiles: '**/*.*'

win:
  icon: icon.ico
  target:
    - nsis
    - portable

files:
  - out/**
  - package.json

extraResources:
  - from: resources/bin
    to: bin
