appId: com.diat.converter
productName: The Diat Converter

directories:
  buildResources: resources

mac:
  icon: icon.icns
  category: public.app-category.utilities
  target:
    - dmg
  x64ArchFiles: '**/*.*'
  extraResources:
    - from: resources/bin/darwin-${arch}
      to: bin/darwin-${arch}

win:
  icon: icon.ico
  target:
    - nsis
    - portable
  extraResources:
    - from: resources/bin/win32-${arch}
      to: bin/win32-${arch}

files:
  - out/**
  - package.json
